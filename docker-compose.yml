name: borderless

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-borderless}
      POSTGRES_USER: ${DB_USER:-borderless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-borderless-local}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]

  # Shared rate-limit counts and the job queues; append-only so queued jobs survive a restart.
  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:-local-redis-password}',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    volumes:
      - redis-data:/data
    networks: [internal]

  api:
    build: .
    environment: &app-env
      APP_ROLE: api
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-borderless}
      DB_USER: ${DB_USER:-borderless}
      DB_PASSWORD: ${DB_PASSWORD:-borderless-local}
      DB_SSL: ${DB_SSL:-disable}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-borderless}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      MONEY_RATE_LIMIT_PER_MINUTE: ${MONEY_RATE_LIMIT_PER_MINUTE:-30}
      # Turn on for an offline demo: prices from a built-in table, marked fixed-table.
      FX_FIXED_TABLE: ${FX_FIXED_TABLE:-false}
      FEE_BPS: ${FEE_BPS:-50}
      FEE_BPS_BY_PAIR: ${FEE_BPS_BY_PAIR:-}
      LOW_BALANCE_USD: ${LOW_BALANCE_USD:-10}
      TRUST_PROXY: 'true'
      # Local-only operator token for /api/v1/ops; production refuses any value starting with local-.
      OPS_TOKEN: ${OPS_TOKEN:-local-ops-token-for-the-compose-stack-only}
      # Local-only keys; the app refuses to start with them when NODE_ENV is production.
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:-1:bG9jYWwtcGlpLWVuY3J5cHRpb24ta2V5LXYxLTAwMDE=}
      PII_ACTIVE_KEY_VERSION: ${PII_ACTIVE_KEY_VERSION:-1}
      PII_LOOKUP_KEY: ${PII_LOOKUP_KEY:-bG9jYWwtcGlpLWxvb2t1cC1rZXktZm9yLWRldi0wMDA=}
    volumes:
      # Keeps the local signing key across restarts, so sign-ins survive a rebuild.
      - jwt-keys:/app/keys/jwt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  # Same image in the worker role: queues and scheduled jobs, no HTTP. Scale with --scale worker=3.
  worker:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: worker
    volumes:
      - jwt-keys:/app/keys/jwt
    healthcheck:
      test: ['CMD', 'node', 'worker-health.mjs']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  proxy:
    image: caddy:2.10-alpine
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      # Bound to this machine only; set BIND_ADDRESS=0.0.0.0 to expose it on the network on purpose.
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443'
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  db-data:
  redis-data:
  caddy-data:
  jwt-keys:

networks:
  internal:
