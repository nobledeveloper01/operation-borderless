name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-4.18.1.cjs lint
      - name: Format
        run: node .yarn/releases/yarn-4.18.1.cjs format:check
      - name: Type check
        run: node .yarn/releases/yarn-4.18.1.cjs typecheck
      - name: Tests
        run: node .yarn/releases/yarn-4.18.1.cjs test
      - name: Build
        run: node .yarn/releases/yarn-4.18.1.cjs build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t borderless:ci .
